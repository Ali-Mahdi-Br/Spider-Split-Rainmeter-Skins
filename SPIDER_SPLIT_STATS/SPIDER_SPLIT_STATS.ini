[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=SPIDER SPLIT STATS
Author=OpenAI
Information=Fixed companion to SPIDER SPLIT BOLD: corrected RAM percent and non-overlapping readings.
Version=1.2 Animated
License=Free for personal use

[Variables]
Red=221,38,55,255
Blue=22,73,138,255
Midnight=16,31,57,255

[MeasureCPU]
Measure=CPU
Processor=0
UpdateDivider=10
MinValue=0
MaxValue=100

[MeasureRAM]
Measure=PhysicalMemory
UpdateDivider=10

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
MinValue=0
MaxValue=100
UpdateDivider=50

[MeasureDown]
Measure=NetIn
Interface=Best
UpdateDivider=10

[MeasureUp]
Measure=NetOut
Interface=Best
UpdateDivider=10

[PanelMotion]
Measure=Script
ScriptFile=#@#PanelMotion.lua
UpdateDivider=1

[PanelBase]
Meter=Image
ImageName=#@#split-stats-base.png
X=0
Y=0
W=610
H=276

