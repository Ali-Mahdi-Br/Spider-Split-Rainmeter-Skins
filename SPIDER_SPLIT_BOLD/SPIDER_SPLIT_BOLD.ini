; SPIDER SPLIT BOLD — a new minimal typographic clock for Rainmeter
; Separate from the previous gradient clock: hard two-tone digits, comic extrusion,
; diagonal month ribbon, restrained Spider web insignia.
; Date and clock remain LIVE. Windows standard fonts only.

[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=SPIDER SPLIT BOLD
Author=OpenAI
Information=Bold red-blue comic typographic calendar clock for Spider-Man wallpaper
Version=2.2 Animated
License=Free for personal use

[Variables]
Red=221,38,55,255
Blue=22,73,138,255
Midnight=16,31,57,255
White=246,250,252,255

[MeasureDay]
Measure=Time
Format=%d
FormatLocale=en-US
UpdateDivider=600

[MeasureMonth]
Measure=Time
Format=%B
FormatLocale=en-US
UpdateDivider=600

[MeasureWeekday]
Measure=Time
Format=%A
FormatLocale=en-US
UpdateDivider=600

[MeasureClock]
Measure=Time
Format=%#I:%M %p
FormatLocale=en-US
UpdateDivider=10

[ClockMotion]
Measure=Script
ScriptFile=#@#ClockMotion.lua
UpdateDivider=1

[Canvas]
Meter=Image
X=0
Y=0
W=660
H=620
SolidColor=0,0,0,1

; Heavy comic-print extrusion behind a split red-and-blue date.
[DateExtrusion]
Meter=String
MeasureName=MeasureDay
X=134
Y=26
FontFace=Impact
FontSize=319
FontWeight=900
FontColor=12,26,48,210
AntiAlias=1
StringStyle=Bold
ClipString=0

[DateFront]
Meter=String
MeasureName=MeasureDay
X=123
Y=15
FontFace=Impact
FontSize=319
FontWeight=900
FontColor=#Red#
AntiAlias=1
ClipString=0
InlineSetting=Color | 221,38,55,255
InlinePattern=^.
InlineSetting2=Color | 22,73,138,255
InlinePattern2=.$

; Subtle Spider web printed as an emblem (not a large tech HUD).
[Web]
Meter=Image
ImageName=#@#spider-web.png
X=470
Y=74
W=168
H=165

[ComicCuts]
Meter=Image
ImageName=#@#comic-cuts.png
X=463
Y=206
W=155
H=175

; Deep navy diagonal sticker crosses the huge number, unlike the old clock.
[MonthRibbon]
Meter=Image
ImageName=#@#month-ribbon.png
X=86
Y=282
W=535
H=120

[MonthText]
Meter=String
MeasureName=MeasureMonth
X=157
Y=305
FontFace=Arial Black
FontSize=39
FontWeight=900
FontColor=#White#
AntiAlias=1
StringCase=Upper
InlineSetting=CharacterSpacing | 0.5 | 0.5
Angle=6.245918

[WeekdayAccent]
Meter=Shape
Shape=Line 49,239,49,519 | StrokeWidth 3 | Stroke Color 221,38,55,255

[WeekdayVertical]
Meter=String
MeasureName=MeasureWeekday
X=36
Y=519
FontFace=Segoe UI Semibold
FontSize=15
FontWeight=700
FontColor=#Midnight#
StringCase=Upper
Angle=4.71238898
AntiAlias=1
InlineSetting=CharacterSpacing | 3 | 3

[TimeLabel]
Meter=String
MeasureName=MeasureClock
X=152
Y=430
FontFace=Arial Black
FontSize=31
FontWeight=900
FontColor=#Midnight#
AntiAlias=1
InlineSetting=CharacterSpacing | 1 | 1

[RedUnderbar]
Meter=Shape
Shape=Rectangle 154,495,264,5,2 | Fill Color 221,38,55,255 | StrokeWidth 0

[BlueTip]
Meter=Shape
Shape=Rectangle 422,495,48,5,2 | Fill Color 22,73,138,255 | StrokeWidth 0
