; Spider Split Power Pro: 4 icon-only transparent buttons
; Left -> right: Power, Restart, Sleep, Lock
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,0

[Metadata]
Name=Spider Split Power Pro
Author=OpenAI
Information=Power, restart, sleep and lock, transparent 4-button mini dock.
Version=3.0
License=Free personal use

[MeterPower]
Meter=Image
ImageName=#@#power.png
X=0
Y=0
W=56
H=56
PreserveAspectRatio=1
AntiAlias=1
SolidColor=0,0,0,1
LeftMouseUpAction=["wscript.exe" "#@#Actions.vbs" "power"]
MouseOverAction=[!SetOption "MeterPower" "ImageName" "#@#power_hover.png"][!UpdateMeter "MeterPower"][!Redraw]
MouseLeaveAction=[!SetOption "MeterPower" "ImageName" "#@#power.png"][!UpdateMeter "MeterPower"][!Redraw]

[MeterRestart]
Meter=Image
ImageName=#@#restart.png
X=61
Y=0
W=56
H=56
PreserveAspectRatio=1
AntiAlias=1
SolidColor=0,0,0,1
LeftMouseUpAction=["wscript.exe" "#@#Actions.vbs" "restart"]
MouseOverAction=[!SetOption "MeterRestart" "ImageName" "#@#restart_hover.png"][!UpdateMeter "MeterRestart"][!Redraw]
MouseLeaveAction=[!SetOption "MeterRestart" "ImageName" "#@#restart.png"][!UpdateMeter "MeterRestart"][!Redraw]

[MeterSleep]
Meter=Image
ImageName=#@#sleep.png
X=122
Y=0
W=56
H=56
PreserveAspectRatio=1
AntiAlias=1
SolidColor=0,0,0,1
