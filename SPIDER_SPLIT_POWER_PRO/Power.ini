MouseOverAction=[!SetOption "MeterSleep" "ImageName" "#@#sleep_hover.png"][!UpdateMeter "MeterSleep"][!Redraw]
MouseLeaveAction=[!SetOption "MeterSleep" "ImageName" "#@#sleep.png"][!UpdateMeter "MeterSleep"][!Redraw]

[MeterLock]
Meter=Image
ImageName=#@#lock.png
X=183
Y=0
W=56
H=56
PreserveAspectRatio=1
AntiAlias=1
SolidColor=0,0,0,1
LeftMouseUpAction=["wscript.exe" "#@#Actions.vbs" "lock"]
MouseOverAction=[!SetOption "MeterLock" "ImageName" "#@#lock_hover.png"][!UpdateMeter "MeterLock"][!Redraw]
