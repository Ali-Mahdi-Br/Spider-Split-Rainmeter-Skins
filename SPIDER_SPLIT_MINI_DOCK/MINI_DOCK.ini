[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,0

[Metadata]
Name=SPIDER SPLIT MINI DOCK
Author=OpenAI
Information=Transparent compact companion. 4 clickable Windows shortcuts, real C drive used percent and uptime. No background panel.
Version=2.0
License=Free for personal use

[Variables]
Red=237,51,72,255
Blue=55,158,240,255
White=240,248,255,255
Dim=156,187,223,255

[MeasureDiskUsed]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=30

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!h %2!02i!m
UpdateDivider=10

[Art]
Meter=Image
ImageName=#@#mini-dock-art.png
X=0
Y=0
W=207
H=279

; Small, invisible hit zones. Graphics underneath are not obscured.
[ClickThisPC]
Meter=Image
X=10
Y=42
W=184
H=29
SolidColor=0,0,0,1
LeftMouseUpAction=["explorer.exe" "shell:MyComputerFolder"]
ToolTipText=This PC

[ClickDownloads]
Meter=Image
X=10
Y=79
W=184
H=29
SolidColor=0,0,0,1
LeftMouseUpAction=["explorer.exe" "shell:Downloads"]
ToolTipText=Downloads

[ClickBrowser]
Meter=Image
X=10
Y=116
W=184
H=29
SolidColor=0,0,0,1
LeftMouseUpAction=["https://www.google.com/"]
ToolTipText=Browser

[ClickSettings]
Meter=Image
X=10
Y=153
W=184
H=29
SolidColor=0,0,0,1
LeftMouseUpAction=["ms-settings:"]
ToolTipText=Windows Settings

[DiskPercent]
Meter=String
MeasureName=MeasureDiskUsed
X=189
Y=210
W=72
H=24
StringAlign=Right
FontFace=Segoe UI
FontSize=13
FontWeight=700
FontColor=#Red#
AntiAlias=1
Percentual=1
NumOfDecimals=0
Text=%1%

[DiskBar]
Meter=Bar
MeasureName=MeasureDiskUsed
X=12
Y=241
W=178
H=2
BarOrientation=Horizontal
BarColor=#Red#
SolidColor=0,0,0,0

[Uptime]
Meter=String
MeasureName=MeasureUptime
X=190
Y=246
W=132
H=22
StringAlign=Right
FontFace=Segoe UI Semibold
FontSize=10
FontWeight=600
FontColor=#Blue#
AntiAlias=1
Text=%1
